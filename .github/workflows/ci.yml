name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          bun run commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      - name: Check pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          bun run commitlint
          --from "${{ github.event.before }}"
          --to "${{ github.sha }}"
          --verbose

      - name: Check dispatched commit message
        if: github.event_name == 'workflow_dispatch'
        run: bun run commitlint --last --verbose

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify SDK package
        run: bun run --cwd packages/sdk verify:package

  rust-contracts:
    name: Claim Cell contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install RISC-V target
        run: make -C packages/claim-cell-script prepare

      - name: Check Rust formatting
        run: make -C packages/claim-cell-script fmt

      - name: Check Rust crates
        run: make -C packages/claim-cell-script check

      - name: Run Rust lints
        run: make -C packages/claim-cell-script clippy

      - name: Run VM tests
        run: make -C packages/claim-cell-script test

      - name: Report release sizes
        run: make -C packages/claim-cell-script size
